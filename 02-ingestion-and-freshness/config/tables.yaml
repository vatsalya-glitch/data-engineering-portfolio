# One entry per table. Two halves:
#
# INGESTION (how the table is loaded) - the WRITE SQL is always ingestion/sql/<table>.sql
#   snapshot     -> read the whole source, swap the table          (small dimension tables)
#   incremental  -> read rows newer than the watermark, MERGE      (big growing tables)
#   file_drop    -> wait for the vendor's _SUCCESS marker, load    (files from partners)
#   cdc          -> apply the next Debezium change file with MERGE (mirroring a database)
#
# FRESHNESS (how consumers check the table before using it)
#   recency        -> MAX(_loaded_at) is newer than max_age_hours   (simple, weakest)
#   partition      -> rows exist for run_date                       (date-aware, rerun-safe)
#   control_table  -> a SUCCESS row exists in _freshness_log        (explicit handshake, strongest)
# auto_ingest: if stale, may the freshness step run the ingestion itself? (false = just fail)

raw_customers:
  ingestion: snapshot
  source: data/source/customers.csv
  key: customer_id
  check: recency
  max_age_hours: 24
  auto_ingest: true

raw_orders:
  ingestion: incremental
  source: data/source/orders.csv
  key: order_id
  watermark_column: updated_at
  check: partition
  date_column: order_date
  min_rows: 1
  auto_ingest: true

raw_payments:
  ingestion: file_drop
  source: data/source/vendor_drops/payments_{run_date}
  key: payment_id
  check: control_table
  date_column: payment_date
  auto_ingest: true

raw_order_status:
  ingestion: cdc
  source: data/source/cdc/order_status
  key: order_id
