# The finance reports and the steps each one needs, read top to bottom:
#
#   report                                    reports/<name>.sql
#     ingestion:       raw tables the report reads directly      ingestion/<name>.sql
#     transformation:  shared tables the report reads            transformation/<name>.sql
#       <transformation>:
#         ingestion:       raw tables it is built from
#         transformation:  other transformations it is built from (nested the same way)
#
# A table that several reports need is written in each of them, but runs
# only once. graph.py checks it is described the same way everywhere.
#
# Only reports and their steps belong here. The DAG settings (name,
# schedule, connections) are in main.py.

reports:

  revenue_report:
    transformation:
      net_revenue:
        ingestion:
          - refunds
        transformation:
          order_revenue:
            ingestion:
              - orders
              - order_items

  refunds_report:
    ingestion:
      - refunds
    transformation:
      order_revenue:
        ingestion:
          - orders
          - order_items

  shipping_cost_report:
    ingestion:
      - shipping
    transformation:
      order_revenue:
        ingestion:
          - orders
          - order_items

  invoice_reconciliation_report:
    ingestion:
      - invoices
    transformation:
      net_revenue:
        ingestion:
          - refunds
        transformation:
          order_revenue:
            ingestion:
              - orders
              - order_items
