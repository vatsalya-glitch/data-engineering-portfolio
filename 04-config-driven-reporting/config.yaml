# The finance reports as a graph: each table lists the tables it is built from.
#
#   transformation:  shared tables      script: transformation/<name>.sql
#   reports:         the final reports  script: reports/<name>.sql
#
# Any other name in a list is a raw table copied from the shop database
# (script: ingestion/<name>.sql). Raw tables are built from nothing, so they
# need no entry of their own.
#
# Each table is written once, however many reports use it. graph.py works
# out the order: every table after the tables it needs, and the tables most
# reports need first.
#
# The DAG settings (name, schedule, connections) are in main.py.

transformation:

  order_revenue:
    - orders
    - order_items

  net_revenue:
    - order_revenue
    - refunds

reports:

  revenue_report:
    - net_revenue

  refunds_report:
    - order_revenue
    - refunds

  shipping_cost_report:
    - order_revenue
    - shipping

  invoice_reconciliation_report:
    - net_revenue
    - invoices
