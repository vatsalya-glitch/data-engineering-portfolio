# The finance reports and the steps each one needs, in three layers:
#
#   ingestion       copy raw tables from the shop database   ingestion/<name>.sql
#   transformation  shared tables built from raw tables       transformation/<name>.sql
#   reports         the final reports                         reports/<name>.sql
#
# Each transformation and report lists the tables it reads. graph.py turns
# these lists into the order the tasks run in.
#
# Only reports and their steps belong here. The DAG settings (name,
# schedule, connections) are in main.py.

# Raw tables copied from the database. One script each: ingestion/<name>.sql
ingestion:
  - orders
  - order_items
  - invoices
  - refunds
  - shipping

# Shared tables. One script each: transformation/<name>.sql
transformation:
  order_revenue:
    ingestion: [orders, order_items]
  net_revenue:
    ingestion: [refunds]
    transformation: [order_revenue]

# Final reports. One script each: reports/<name>.sql
reports:
  revenue_report:
    transformation: [net_revenue]
  refunds_report:
    ingestion: [refunds]
    transformation: [order_revenue]
  shipping_cost_report:
    ingestion: [shipping]
    transformation: [order_revenue]
  invoice_reconciliation_report:
    ingestion: [invoices]
    transformation: [net_revenue]
