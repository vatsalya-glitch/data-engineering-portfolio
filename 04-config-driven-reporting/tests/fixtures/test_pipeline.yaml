# A small valid pipeline. Tests load it, break one rule, and check the error.
pipeline:
  dag_id: test_pipeline
  schedule: "0 6 * * *"
  period: day
  project: my-project
  export_bucket: my-bucket
  alert_email: [data-team@example.com]

ingestion:
  orders:
    load:
      uri: "gs://landing/orders/{{ period_start }}/*.parquet"
      mode: period
    checks:
      - "SELECT COUNT(*) = 0 FROM raw.orders WHERE order_id IS NULL"
  customers:
    load:
      uri: "gs://landing/customers/{{ period_start }}/*.parquet"
      mode: replace
  shipments:
    wait_for:
      fresh_when: "SELECT MAX(event_time) >= TIMESTAMP('{{ period_end }}') FROM raw.shipments"
    checks:
      - "SELECT COUNT(*) = 0 FROM raw.shipments WHERE order_id IS NULL"

transformation:
  order_shipments:
    sql: transformation/order_shipments.sql
    ingestion: [orders, shipments]
    checks:
      - "SELECT COUNT(*) = 0 FROM mart.order_shipments WHERE order_id IS NULL"

reports:
  delivery_report:
    sql: reports/delivery_report.sql
    ingestion: [customers]
    transformation: [order_shipments]
    steps:
      - approval
      - export
      - email: {to: [logistics@example.com]}
