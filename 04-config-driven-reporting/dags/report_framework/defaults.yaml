# Framework defaults, shared by every pipeline.
#
# Change a value here and it reaches every pipeline that doesn't set it.
# A pipeline config overrides a value by setting the same key in the same
# place: under `pipeline:`, under a table's `wait_for:`, or under a step.

# The dataset each layer writes to. SQL files and checks refer to these.
datasets:
  ingestion: raw           # raw.<ingestion table>
  transformation: mart     # mart.<transformation table>
  reports: reports         # reports.<report>

# Keys under `pipeline:` in a pipeline config.
pipeline:
  timezone: UTC
  start_date: 2026-01-01
  gcp_conn_id: google_cloud_default
  smtp_conn_id: smtp_default
  retries: 1               # retries per task (freshness waits and approvals never retry)
  retry_delay_minutes: 5
  max_active_runs: 1

# Keys under an ingestion table's `wait_for:` (a table loaded outside this DAG).
wait_for:
  timeout_hours: 4             # the wait fails after this long
  poke_interval_minutes: 10    # how often it checks again

# Settings per step type, under a report's `steps:`.
steps:
  approval:
    timeout_hours: 8           # no answer by then = rejected: the remaining steps are skipped
